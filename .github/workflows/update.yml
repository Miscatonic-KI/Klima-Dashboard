name: Update Feeds

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Abhängigkeiten installieren
        run: |
          pip install google-genai

      - name: Feeds & KI-Lagebericht abrufen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetcher.py

      - name: Änderungen speichern & hochladen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase || true
          git add data.json summary.html
          git commit -m "Automatisches Update: data.json & summary.html mit KI-Bericht" || exit 0
          git push

      - name: KI-Briefing generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_briefing.py

      - name: Änderungen speichern & hochladen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase || true
          git add data.json summary.html generated/briefing.html
          git commit -m "Update feeds, summary & KI briefing" || exit 0
          git push

