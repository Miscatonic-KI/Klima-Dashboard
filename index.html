<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klima-Krisen-Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #273548;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        .search-container input:focus {
            border-color: var(--accent);
        }

        .category-section {
            margin-bottom: 40px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .category-header h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--accent);
        }

        .category-desc {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 1rem;
            margin: 0;
            color: #e2e8f0;
        }

        .info-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
        }

        .info-btn:hover {
            color: var(--accent);
        }

        .feed-items {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.85rem;
        }

        .feed-items li {
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .feed-items a {
            color: #93c5fd;
            text-decoration: none;
        }

        .feed-items a:hover {
            text-decoration: underline;
        }

        /* Modal Overlay für Feed-Beschreibungen */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        .modal-content h3 { margin-top: 0; color: var(--accent); }
        .close-modal {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            float: right;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌍 Klima-Krisen-Dashboard</h1>
        <p>Echtzeit-Monitoring via GitHub Automatisierung</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Dashboard nach Begriffen durchsuchen..." onkeyup="filterFeeds()">
    </div>

    <div id="dashboard-container">
        <p style="text-align: center; color: var(--text-muted);">Lade Dashboard-Daten...</p>
    </div>

    <!-- Modal für Beschreibungen -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modal-title">Feed-Info</h3>
            <p id="modal-desc" style="color: var(--text-muted); line-height: 1.5;"></p>
            <button class="close-modal" onclick="closeModal()">Schließen</button>
        </div>
    </div>

    <script>
        let allFeedsData = [];

        async function loadDashboard() {
            try {
                const response = nachResponse = await fetch('data.json?t=' + Date.now());
                allFeedsData = await response.json();
                renderDashboard(allFeedsData);
            } catch (error) {
                document.getElementById('dashboard-container').innerHTML = `<p style="color: #fca5a5; text-align: center;">Fehler beim Laden der data.json. Wurde der Workflow ausgeführt?</p>`;
            }
        }

        function renderDashboard(data) {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            // Nach Kategorien gruppieren
            const categories = {};
            data.forEach((feed, index) => {
                const cat = feed.category || "Allgemein";
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push({ ...feed, globalIndex: index });
            });

            for (const [catName, feeds] of Object.entries(categories)) {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                let gridHtml = '<div class="grid">';
                feeds.forEach(feed => {
                    let itemsHtml = '';
                    if (feed.items && feed.items.length > 0) {
                        feed.items.forEach(item => {
                            itemsHtml += `<li><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></li>`;
                        });
                    } else {
                        itemsHtml = `<li style="color: #94a3b8; font-style: italic;">Aktuell keine neuen Treffer</li>`;
                    }

                    gridHtml += `
                        <div class="card" data-title="${feed.title.toLowerCase()}" data-content="${itemsHtml.toLowerCase()}">
                            <div>
                                <div class="card-top">
                                    <h3>${feed.title}</h3>
                                    <button class="info-btn" onclick='openModal(${JSON.stringify(feed.title)}, ${JSON.stringify(feed.desc)})'>ℹ️</button>
                                </div>
                                <ul class="feed-items">${itemsHtml}</ul>
                            </div>
                        </div>
                    `;
                });
                gridHtml += '</div>';

                section.innerHTML = `
                    <div class="category-header">
                        <h2>📌 ${catName}</h2>
                    </div>
                    ${gridHtml}
                `;
                container.appendChild(section);
            }
        }

        function openModal(title, desc) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc || "Keine Beschreibung hinterlegt.";
            document.getElementById('modal.style.display').style.display = 'flex'; // syntax fix below
        }

        // Korrektur für Modal Display
        window.openModal = function(title, desc) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc || "Keine Beschreibung hinterlegt.";
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function filterFeeds() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                const content = card.getAttribute('data-content');
                if (title.includes(input) || content.includes(input)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
