<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis-Tracker - Szenarien-Labor</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --section-bg: #ffffff;
            --card-bg: #f9fafb;
            --text-main: #111827;
            --text-muted: #4b5563;
            --accent: #8b0000;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin: 20px 0 25px 0;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            color: var(--text-main);
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 12px 0;
        }

        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            background: var(--section-bg);
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🧪 Szenarien & Kaskaden</h1>
        <p>KI-gestützte Hypothesen über mögliche Dominoeffekte</p>
        <a href="index.html" class="back-link">← Zurück zum Haupt-Dashboard</a>
    </header>

    <div class="container" id="scenarios-container">
        <p style="text-align: center; color: var(--text-muted);">Berechne Systemkaskaden...</p>
    </div>

    <script>
        async function loadScenarios() {
            try {
                const response = await fetch('generated/scenarios_content.html?t=' + Date.now());
                if (!response.ok) throw new Error('Fehler beim Laden');
                document.getElementById('scenarios-container').innerHTML = await response.text();
            } catch (error) {
                document.getElementById('scenarios-container').innerHTML = 
                    '<p style="color: #990000; text-align: center;">Noch keine Szenarien generiert. Bitte Workflow-Lauf abwarten.</p>';
            }
        }
        window.onload = loadScenarios;
    </script>
</body>
</html>
